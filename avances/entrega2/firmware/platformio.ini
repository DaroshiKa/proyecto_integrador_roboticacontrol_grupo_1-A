; Stage 1-2 bring-up: motor drivers + encoders + one-joint position PID.
; Pinned to Arduino-ESP32 core 2.0.x: it is the known-good base for micro_ros_platformio
; and it is the LEDC API (ledcSetup/ledcAttachPin) used in main.cpp.
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=0

; --- Stage 7 (micro-ROS over WiFi, ROS 2 Jazzy): uncomment later, not now ---
; lib_deps = https://github.com/micro-ROS/micro_ros_platformio
; board_microros_distro = jazzy
; board_microros_transport = wifi
